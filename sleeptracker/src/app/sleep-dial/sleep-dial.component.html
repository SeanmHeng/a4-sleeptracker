<svg viewBox="0 0 240 240" class="dial" role="img"
  aria-label="Sleep dial. Drag the bed or alarm handle to change times."
  (pointermove)="move($event)" (pointerup)="endDrag()" (pointercancel)="endDrag()">
  <circle [attr.cx]="120" [attr.cy]="120" r="95" class="track" />
  <path [attr.d]="arc" class="arc" />
  @for (l of labels; track l.text) {
    <text [attr.x]="point(l.min).x * 0.62 + 120 * 0.38" [attr.y]="point(l.min).y * 0.62 + 120 * 0.38 + 4"
      text-anchor="middle" class="label">{{ l.text }}</text>
  }
  <g class="handle" (pointerdown)="startDrag('bed', $event)">
    <circle [attr.cx]="bed.x" [attr.cy]="bed.y" r="15" />
    <text [attr.x]="bed.x" [attr.y]="bed.y + 5" text-anchor="middle">🛏️</text>
  </g>
  <g class="handle" (pointerdown)="startDrag('wake', $event)">
    <circle [attr.cx]="wake.x" [attr.cy]="wake.y" r="15" />
    <text [attr.x]="wake.x" [attr.y]="wake.y + 5" text-anchor="middle">⏰</text>
  </g>
</svg>
