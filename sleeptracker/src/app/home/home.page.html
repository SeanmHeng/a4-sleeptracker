<ion-header>
  <ion-toolbar>
    <ion-title>SleepLog</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Log last night</ion-card-title>
    </ion-card-header>
    <ion-card-content>Coming soon</ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>How sleepy are you?</ion-card-title>
    </ion-card-header>
    <ion-card-content>Coming soon</ion-card-content>
  </ion-card>

  <ion-list>
    <ion-list-header>
      <ion-label>History</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-label>Overnight</ion-label>
      @if (overnight.length === 0) {
        <ion-note slot="end">No sleep logged yet</ion-note>
      }
    </ion-item>

    <ion-item>
      <ion-label>Sleepiness</ion-label>
      @if (sleepiness.length === 0) {
        <ion-note slot="end">No sleepiness logged yet</ion-note>
      }
    </ion-item>
  </ion-list>
</ion-content>
